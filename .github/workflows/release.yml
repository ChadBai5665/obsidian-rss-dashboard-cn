name: Release Obsidian plugin

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

jobs:
  draft-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate tag against package version
        run: node scripts/check-version-consistency.mjs --tag "$GITHUB_REF_NAME"

      - name: Run canonical checks
        run: npm run check

      - name: Stage release assets
        run: npm run release:stage

      - name: Validate staged release assets
        run: npm run release:check

      - name: Attest build provenance for release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/main.js
            release/manifest.json
            release/styles.css

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=(--draft)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease)
          fi

          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes "Release $GITHUB_REF_NAME" \
            "${release_flags[@]}" \
            release/main.js \
            release/manifest.json \
            release/styles.css
