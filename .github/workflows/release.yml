name: Release Obsidian plugin

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"
      - '[0-9]+.[0-9]+.[0-9]+\+*'

jobs:
  draft-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate tag against package version
        run: node scripts/check-version-consistency.mjs --tag "$GITHUB_REF_NAME"

      - name: Run canonical checks
        run: npm run check

      - name: Stage release assets
        run: npm run release:stage

      - name: Validate staged release assets
        run: npm run release:check

      - name: Attest build provenance for release assets
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: |
            release/main.js
            release/manifest.json
            release/styles.css

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/create-draft-release.mjs
